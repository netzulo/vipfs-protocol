name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: GIT Checkout
        uses: actions/checkout@v4

      - name: NODE Setup
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: YARN Setup
        run: npm install -g yarn@1.22.22

      - name: YARN Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-node22-yarn1-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node22-yarn1-

      - name: INTERNAL-CI
        run: yarn ci

